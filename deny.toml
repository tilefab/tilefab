# cargo-deny configuration: `cargo deny check` runs every section below
# (advisories, bans, licenses, sources).

[graph]
all-features = true

# RustSec advisories: vulnerabilities always fail the check; unmaintained
# and unsound crates fail too, yanked versions in Cargo.lock as well.
[advisories]
unmaintained = "all"
yanked = "deny"
ignore = []

# Crates that are banned or present in several versions.
[bans]
# No duplicate today (`syn` 2 left with crossterm's default `derive-more` feature, see the
# root Cargo.toml). Warn rather than fail: a future update may bring one back for a while.
multiple-versions = "warn"
wildcards = "deny"
# This crate is not published: path dependencies without a version are fine.
allow-wildcard-paths = true
highlight = "all"

# All dependencies must use a license from this list
# (for an “A OR B” expression, allowing either license is enough).
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# The workspace crates are not published (`publish = false`): skip checking their
# own license (MIT, declared in the workspace `Cargo.toml`).
ignore = true

# Dependencies may only come from crates.io: no other registry, no git.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
