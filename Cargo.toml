# Cargo workspace: the library crates in `crates/` (`tilefab-core`, `tilefab-term`,
# `tilefab-widget`, `tilefab-input`, and the `tilefab` façade that gathers them), and the
# demo application in `apps/` (`widget-demo`, binary `widget-demo`). Dependencies only
# go downward: core ← cli, widget, input ← tilefab ← widget-demo.
[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Minimum supported Rust version: let chains (crates/tilefab/examples/inline.rs) and the
# `backtrace` / `gimli` / `addr2line` dependencies of the demo need 1.88. Checked by the
# `msrv` job of .github/workflows/ci.yml.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/tilefab/tilefab"
keywords = ["tui", "terminal", "crossterm", "inline", "viewport"]
categories = ["command-line-interface"]
# Not on crates.io yet: remove this line for the first release, and turn the
# `cargo install --path apps/widget-demo` of the READMEs back into `cargo install widget-demo`.
# Every crate is published (crates.io needs the dependencies of `tilefab` in the registry),
# but only `tilefab` is the public entry point; the `tilefab-*` crates say so in their README.
# The packaging step of tools/ci.sh rewrites this exact line in a copy: remove that copy too.
publish = false

[workspace.dependencies]
# The workspace crates. With a version, so that each one can be published on its own.
tilefab = { path = "crates/tilefab", version = "0.1.0" }
tilefab-term = { path = "crates/tilefab-term", version = "0.1.0" }
tilefab-core = { path = "crates/tilefab-core", version = "0.1.0" }
tilefab-input = { path = "crates/tilefab-input", version = "0.1.0" }
tilefab-widget = { path = "crates/tilefab-widget", version = "0.1.0" }

color-eyre = "0.6.5"
# Without the default `derive-more` feature: it pulls `derive_more`, whose proc-macro
# crate depends on `syn` 2, while tokio's macros already use `syn` 3. Nothing here uses the
# methods it generates (`is_key_press()`, `as_key_event()`…). Every crate inherits this
# declaration (`crossterm.workspace = true`): none may turn the default features back on.
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "windows"] }
# Property tests; without the default `fork` and `timeout` features (fewer dependencies).
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# Random task durations of the demo: no dependencies of its own.
fastrand = "2.5.0"
# Local date and time of the demo's line widgets (`tilefab-widget` has no clock): portable
# time-zone support on macOS, Linux and Windows. Cargo.lock lists two proc-macro crates under
# it that are never compiled: `jiff-static` and, through `serde_core`, `serde_derive`. Both
# are declared under `cfg(any())`, a condition never true, only to keep their versions in
# step with their parent crate (`jiff-static` is also the optional `static-tz` feature,
# not enabled here).
jiff = "1.0.3"
# Unix flags of the history file (`O_NONBLOCK`, `O_NOFOLLOW`): only constants are used, no
# `unsafe`. Already in the dependency graph through crossterm.
libc = "0.2.191"
# Counting allocator for the allocation example and test (keeps `unsafe` out of this project).
stats_alloc = "0.1.10"
tokio = "1.54.1"
# Without the default `attributes` feature: `#[instrument]` is not used, and its
# proc-macro crate (`tracing-attributes`) would only add build time.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# The default features but `ansi` (nu-ansi-term): the logs are written without colors
# (`with_ansi(false)`). `tracing-log` stays: mio (under crossterm) logs through `log`, and it
# sends those records to the subscriber.
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "fmt",
    "smallvec",
    "std",
    "tracing-log",
] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

# Lints for every crate (lib, bin, examples, tests); each crate opts in with
# `[lints] workspace = true`. `missing_docs` stays in each library's `lib.rs`, because it
# only makes sense for a library API.
[workspace.lints.rust]
# The project has no `unsafe` code: keep it that way.
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every exception to a lint is an `#[expect(…, reason = "…")]`: it says why, and it warns once
# the exception is no longer needed (an `#[allow]` would stay silently).
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Release binary (`cargo build --release`): a single, fully optimized codegen unit with
# thin LTO across crates; in exchange, a release build links in about 12 s instead of 1 s.
# Symbols are kept (Cargo's default only strips the debug info), so a backtrace shows
# function names: `strip = true` would shrink the demo binary from 2.4 MB to 1.9 MB.
# The binary holds the paths of the dependencies under the Cargo home (panic locations):
# `tools/dist.sh` builds one to distribute with those paths rewritten (`trim-paths`, which
# would do it from here, is not stable yet).
[profile.release]
lto = "thin"
codegen-units = 1

# Release build used by the tests of tools/ci.sh (`cargo test --profile ci`): same
# optimizations and same `cfg(debug_assertions)` as `release`, but an integer overflow
# panics instead of wrapping silently, so the release-only code paths are checked too.
# Thin LTO across a single codegen unit is dropped: it only slows down the build of the
# test binaries.
[profile.ci]
inherits = "release"
overflow-checks = true
lto = false
codegen-units = 16
