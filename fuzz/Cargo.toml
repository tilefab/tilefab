# Fuzz targets for `cargo fuzz` (libFuzzer): see README.md, "Fuzzing". A crate of its own,
# outside the workspace of the project: it needs a nightly toolchain (`cargo +nightly fuzz`),
# and its dependencies (libFuzzer, arbitrary) stay out of the main Cargo.lock.
[package]
name = "tilefab-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace: not a member of the one in the parent directory.
[workspace]

# Not inherited from the parent workspace (`[workspace.lints]`), which this crate is not part
# of: the same rule, no `unsafe` code in the project's sources.
[lints.rust]
unsafe_code = "forbid"

[dependencies]
arbitrary = { version = "1.5.0", features = ["derive"] }
libfuzzer-sys = "0.4.13"
tilefab-core = { path = "../crates/tilefab-core" }
tilefab-widget = { path = "../crates/tilefab-widget" }
tilefab-input = { path = "../crates/tilefab-input" }
unicode-segmentation = "1.13"

[[bin]]
name = "buffer_set_string"
path = "fuzz_targets/buffer_set_string.rs"
test = false
doc = false
bench = false

[[bin]]
name = "line_widget"
path = "fuzz_targets/line_widget.rs"
test = false
doc = false
bench = false

[[bin]]
name = "layout_split"
path = "fuzz_targets/layout_split.rs"
test = false
doc = false
bench = false

[[bin]]
name = "line_editor"
path = "fuzz_targets/line_editor.rs"
test = false
doc = false
bench = false
