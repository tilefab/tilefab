[package]
name = "widget-demo"
description = "Demo CLI with a variable-height inline viewport, built on tilefab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
# Published with the first release, so that `cargo install widget-demo` gives a ready-to-run
# demo (until then, the READMEs say `cargo install --path apps/widget-demo`).
publish.workspace = true

[[bin]]
# Not `tilefab`: an installed binary with the library's name would look like an official tool.
name = "widget-demo"
path = "src/main.rs"

[dependencies]
color-eyre.workspace = true
fastrand.workspace = true
jiff.workspace = true
tilefab.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
# The tests draw on a test backend (`Backend::with_fixed`, `Terminal::backend_mut`).
tilefab = { workspace = true, features = ["testing"] }
# `test-util`: paused virtual time, so tests of the simulated tasks (3 to 10 s) run instantly.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
