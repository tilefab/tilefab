# Continuous integration: runs tools/ci.sh (fmt, clippy, tests, doc, cargo-deny) on stable,
# then builds and tests with the MSRV (job `msrv`).
# The pty scripts of tools/ are kept local (see README.md).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run checks
        run: tools/ci.sh

  # Builds and tests with the minimum supported Rust version (`rust-version` in Cargo.toml).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build and test
        run: cargo test --all-targets --all-features
