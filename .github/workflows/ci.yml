# Continuous integration: runs tools/ci.sh (fmt, clippy, tests, doc, cargo-deny, packaging,
# and once a release is tagged cargo-semver-checks) with the
# toolchain pinned in rust-toolchain.toml, then builds and tests with the MSRV (job `msrv`),
# and on Windows and macOS (job `platforms`: the code under `cfg(windows)` or `cfg(unix)`),
# and runs the pty scripts of tools/ on Linux (job `pty`: the programs in a pseudo-terminal,
# their output read by a terminal emulator).
#
# Actions are pinned by commit SHA, not by tag (a tag can be moved to other code); the
# comment gives the version (a format Dependabot understands, if it is enabled). Cargo
# commands run with `--locked`: a Cargo.lock out of sync with Cargo.toml fails instead of
# being updated. The checkout does not keep the token in .git/config (`persist-credentials:
# false`): nothing after it pushes, and the build scripts could read it. Each job stops after
# 30 minutes (a run takes a few; the default limit is 6 hours).
name: CI

# `push` only on main: a branch with an open pull request is already checked by the
# `pull_request` event, so the workflow does not run twice for the same commit.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its run still going. On main, each commit has its own
# group (its SHA): a group also drops a waiting run when another arrives, and every merge must
# be checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history and the tags: `cargo semver-checks` compares the API with the
          # last release tag (`v*`), which must be in the clone.
          fetch-depth: 0

      # Installs the toolchain and components named in rust-toolchain.toml.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Fixed versions: deny.toml is checked against cargo-deny (update both together), and
      # cargo-semver-checks must read the rustdoc JSON of the pinned toolchain (update it
      # with rust-toolchain.toml). The versions are also in tools/ci.sh.
      - name: Install cargo-deny and cargo-semver-checks
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.21.0,cargo-semver-checks@0.51.0

      - name: Run checks
        run: tools/ci.sh

  # Builds and tests with the minimum supported Rust version (`rust-version` in Cargo.toml).
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup is preinstalled on the runner: no third-party action needed.
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal && rustc +1.88 --version

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # `+1.88`: without it, rust-toolchain.toml would win and the job would not test the MSRV.
      - name: Build and test
        run: cargo +1.88 test --locked --all-targets --all-features

  # Lints and tests on the other systems: the code under `cfg(windows)` (console events,
  # file options) is compiled nowhere else, and macOS has its own terminal and file system.
  # The static checks that do not depend on the system stay in `checks`.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-features

  # End to end, in a pseudo-terminal read by a terminal emulator (pyte): the inline viewport
  # (no flicker, no lost log), the demo (resize, zero width or height, line editor, signals,
  # panic, degraded mode) and the one-call setup (quickstart, panic report kept on screen).
  # The scripts are the ones of CONTRIBUTING.md, on the debug builds. Linux only: the pty
  # module and termios are Unix, and macOS gives the same results locally.
  pty:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The examples (`inline`, `panic_report`) and the binaries (`widget-demo`, `quickstart`).
      - name: Build the programs the scripts launch
        run: cargo build --locked --examples && cargo build --locked

      # The Python of the runner, in a venv; the packages pinned with the hash of their wheel.
      - name: Install the Python packages of the pty scripts
        run: |
          python3 --version
          python3 -m venv tools/.venv
          tools/.venv/bin/pip install --require-hashes --only-binary=:all: -r tools/requirements-pty.txt

      - name: Inline viewport (check_inline.py)
        run: tools/.venv/bin/python tools/check_inline.py

      - name: Demo application (check_app.py)
        run: tools/.venv/bin/python tools/check_app.py

      - name: One-call setup (check_default_terminal.py)
        run: tools/.venv/bin/python tools/check_default_terminal.py
