# Weekly fuzzing: each target of fuzz/ (see README.md, "Fuzzing") runs for 60 seconds, so
# that an invariant broken by a change shows up even though tools/ci.sh only builds and
# lints the targets. A crash fails the job and keeps the input that caused it as an artifact
# of the run, to replay locally (`cargo +nightly fuzz run <target> <file>`). The corpus
# starts empty each time: nothing is kept between runs.
#
# Pinned like ci.yml (actions by commit SHA, cargo-fuzz by version), except the toolchain:
# cargo fuzz needs a nightly, and this job takes the current one. A nightly that breaks the
# build fails this job only, never a pull request.
name: Fuzz

on:
  schedule:
    # Mondays at 06:47 UTC, after advisories.yml (not on the hour, when the scheduled runs
    # of GitHub pile up).
    - cron: "47 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [buffer_set_string, layout_split, line_editor, line_widget]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The nightly runs the targets; cargo-fuzz itself builds with rust-toolchain.toml.
      - name: Install Rust nightly and the pinned toolchain
        run: rustup toolchain install nightly --profile minimal && rustup toolchain install

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz@0.13.2

      - name: Fuzz ${{ matrix.target }} for 60 s
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60

      - name: Keep the crash
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
