[package]
name = "tilefab-term"
description = "Terminal side of tilefab: crossterm backend, double-buffered terminal, inline viewport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
# Hooks for tests, off by default: a backend with a fixed size and cursor
# (`Backend::with_fixed`…), and write access to the stream and the backend (`writer_mut`,
# `Terminal::backend_mut`), which would bypass what `Terminal` knows of the screen. Enable it
# in dev-dependencies only.
testing = []

[dependencies]
crossterm.workspace = true
tilefab-core.workspace = true
# One warning, when the cursor position query fails after a resize; the application
# chooses where it goes (or drops it) by installing a subscriber.
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
# The terminal simulator of the frame-commit tests splits text into graphemes.
unicode-segmentation.workspace = true

[lints]
workspace = true
