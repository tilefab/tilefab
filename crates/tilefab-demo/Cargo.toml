[package]
name = "tilefab-demo"
description = "Demo CLI with a variable-height inline viewport, built on tilefab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# Command-line utility only: never published, whatever the workspace setting becomes.
publish = false

[[bin]]
name = "tilefab"
path = "src/main.rs"
# Same name as the library crate: document the library only.
doc = false

[dependencies]
color-eyre.workspace = true
crossterm.workspace = true
fastrand.workspace = true
tilefab.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# `test-util`: paused virtual time, so tests of the simulated tasks (3 to 10 s) run instantly.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
