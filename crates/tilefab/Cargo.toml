[package]
name = "tilefab"
description = "Small TUI library on crossterm with an inline viewport: façade over the tilefab-* crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# docs.rs: document the optional modules too (`widget` and `input` are on by default, but
# the build there must not depend on that).
[package.metadata.docs.rs]
all-features = true

[features]
default = ["widget", "input"]
# The one-line composed widget (`LineWidget`).
widget = ["dep:tilefab-widget"]
# The prompt line editor (`LineEditor`).
input = ["dep:tilefab-input"]

[dependencies]
# Public dependency: `LineEditor::handle_key` and `KeyBinding` take crossterm types, so it is
# re-exported (`tilefab::crossterm`) and applications use the very same version. Moving to
# another crossterm minor version is therefore a breaking release of tilefab.
crossterm.workspace = true
tilefab-term.workspace = true
tilefab-core.workspace = true
tilefab-input = { workspace = true, optional = true }
tilefab-widget = { workspace = true, optional = true }

[dev-dependencies]
stats_alloc.workspace = true

[[example]]
name = "fullscreen"
required-features = ["widget"]

[[example]]
name = "inline"
required-features = ["widget"]

[[example]]
name = "cell_alloc"
required-features = ["widget"]

[[test]]
name = "terminal_alloc"
required-features = ["widget"]

[[test]]
name = "widget_alloc"
required-features = ["widget"]

[lints]
workspace = true
